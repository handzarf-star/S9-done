    <!-- Inter is self-hosted now, two variable files covering the full
         weight axis for both display and body, so it lives as @font-face
         in index.css instead of a Google Fonts link. @font-face is not
         @import, so the ordering problem noted below does not apply to it.
         JetBrains Mono is unchanged and still comes from Google Fonts,
         which is why the link tag stays. An @import inside index.css sits
         after the Tailwind import once the bundle is built, and a browser
         ignores any @import that is not at the top of the file, so a
         typeface loaded that way would silently never arrive. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <meta name="description" content="Pravimo softver za pozivne centre, skladišta i firme koje odluke donose na osnovu brojki. Pulse, Atlas, Sonar i Libra, plus rješenja po mjeri. Sarajevo, od 2015." />
    <link rel="canonical" href="https://shape9.agency/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
